name: Deploy NebulaFlow

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "nebula-dist/**"
      - "deploy/nginx-nebula.conf"
      - ".github/workflows/deploy-nebula.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UCLOUD_HOST: ${{ secrets.UCLOUD_HOST }}
      UCLOUD_PORT: ${{ secrets.UCLOUD_PORT }}
      UCLOUD_USER: ${{ secrets.UCLOUD_USER }}
      UCLOUD_SUDO_PASSWORD: ${{ secrets.UCLOUD_SUDO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.UCLOUD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan "$UCLOUD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy NebulaFlow via SSH
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"

          # Create tarball of nebula-dist and nginx config, pipe through SSH
          tar czf - -C nebula-dist . | \
            ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" \
            "cat > /tmp/nebula-dist.tar.gz"

          # Send sudo env
          REMOTE_SUDO_ENV="/tmp/nf-sudo.env"
          SUDO_ENV=$(mktemp)
          trap 'rm -f "$SUDO_ENV"' EXIT
          chmod 600 "$SUDO_ENV"
          printf 'export SUDO_PASSWORD=%q\n' "$UCLOUD_SUDO_PASSWORD" > "$SUDO_ENV"
          scp -P "$SSH_PORT" "$SUDO_ENV" \
            "$UCLOUD_USER@$UCLOUD_HOST:$REMOTE_SUDO_ENV"

          # Send nginx config
          scp -P "$SSH_PORT" deploy/nginx-nebula.conf \
            "$UCLOUD_USER@$UCLOUD_HOST:/tmp/nginx-nebula.conf"

          # Execute deployment on server
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" 'bash -se' <<REMOTE
          set -e
          trap 'rm -f $REMOTE_SUDO_ENV /tmp/nebula-dist.tar.gz /tmp/nginx-nebula.conf' EXIT
          chmod 600 $REMOTE_SUDO_ENV
          . $REMOTE_SUDO_ENV
          run_sudo() {
            printf '%s\n' "\$SUDO_PASSWORD" | sudo -S -p '' "\$@"
          }

          echo "=== Extracting NebulaFlow frontend ==="
          run_sudo mkdir -p /var/www/nebula
          run_sudo tar xzf /tmp/nebula-dist.tar.gz -C /var/www/nebula/
          run_sudo chown -R www-data:www-data /var/www/nebula

          echo "=== Installing nginx config ==="
          run_sudo cp /tmp/nginx-nebula.conf /etc/nginx/conf.d/nebula.conf
          run_sudo nginx -t

          echo "=== Ensuring SSL ==="
          run_sudo certbot --nginx -d nebula.hoarfrost.cloud --non-interactive --agree-tos --register-unsafely-without-email --redirect || \
            echo "WARN: certbot skipped (may already have cert)"

          echo "=== Reloading nginx ==="
          run_sudo systemctl reload nginx

          echo "=== Done ==="
          REMOTE
