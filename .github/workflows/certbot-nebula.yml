name: Certbot Nebula SSL

on:
  workflow_dispatch:

jobs:
  certbot:
    runs-on: ubuntu-latest
    env:
      UCLOUD_HOST: ${{ secrets.UCLOUD_HOST }}
      UCLOUD_PORT: ${{ secrets.UCLOUD_PORT }}
      UCLOUD_USER: ${{ secrets.UCLOUD_USER }}
      UCLOUD_SUDO_PASSWORD: ${{ secrets.UCLOUD_SUDO_PASSWORD }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.UCLOUD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${UCLOUD_PORT:-22}"
          ssh-keyscan -p "$SSH_PORT" "$UCLOUD_HOST" >> ~/.ssh/known_hosts
          ssh-keyscan "$UCLOUD_HOST" >> ~/.ssh/known_hosts

      - name: Run certbot for nebula.hoarfrost.cloud
        run: |
          SSH_PORT="${UCLOUD_PORT:-22}"
          REMOTE_SUDO_ENV="/tmp/certbot-sudo.env"
          SUDO_ENV=$(mktemp)
          trap 'rm -f "$SUDO_ENV"' EXIT
          chmod 600 "$SUDO_ENV"
          printf 'export SUDO_PASSWORD=%q\n' "$UCLOUD_SUDO_PASSWORD" > "$SUDO_ENV"
          scp -P "$SSH_PORT" "$SUDO_ENV" \
            "$UCLOUD_USER@$UCLOUD_HOST:$REMOTE_SUDO_ENV"
          ssh -p "$SSH_PORT" "$UCLOUD_USER@$UCLOUD_HOST" 'bash -se' <<REMOTE
          set -e
          trap 'rm -f $REMOTE_SUDO_ENV' EXIT
          chmod 600 $REMOTE_SUDO_ENV
          . $REMOTE_SUDO_ENV
          run_sudo() {
            printf '%s\n' "\$SUDO_PASSWORD" | sudo -S -p '' "\$@"
          }
          run_sudo certbot --nginx -d nebula.hoarfrost.cloud --non-interactive --agree-tos --register-unsafely-without-email --redirect
          run_sudo nginx -t
          echo "Certbot done successfully"
          REMOTE
