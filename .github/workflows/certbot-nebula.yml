name: Certbot Nebula SSL

on:
  workflow_dispatch:

jobs:
  certbot:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UCLOUD_SSH_PRIVATE_KEY }}

      - name: Run certbot for nebula.hoarfrost.cloud
        run: |
          SSH_PORT="${{ secrets.UCLOUD_PORT }}"
          REMOTE_SUDO_ENV="/tmp/certbot-sudo.env"
          SUDO_ENV=$(mktemp)
          trap 'rm -f "$SUDO_ENV"' EXIT
          chmod 600 "$SUDO_ENV"
          printf 'export SUDO_PASSWORD=%q\n' "${{ secrets.UCLOUD_SUDO_PASSWORD }}" > "$SUDO_ENV"
          ssh-keyscan -p "$SSH_PORT" ${{ secrets.UCLOUD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -P "$SSH_PORT" "$SUDO_ENV" \
            "${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }}:$REMOTE_SUDO_ENV"
          ssh -p "$SSH_PORT" "${{ secrets.UCLOUD_USER }}@${{ secrets.UCLOUD_HOST }}" 'bash -se' <<'REMOTE'
          set -e
          trap 'rm -f $REMOTE_SUDO_ENV' EXIT
          chmod 600 $REMOTE_SUDO_ENV
          . $REMOTE_SUDO_ENV
          run_sudo() {
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
          }
          run_sudo certbot --nginx -d nebula.hoarfrost.cloud --non-interactive --agree-tos --register-unsafely-without-email --redirect
          run_sudo nginx -t
          echo "Certbot done successfully"
          REMOTE
