# wb.hoarfrost.cloud —— 首次签发证书用的「引导块」（HTTP only）
#
# 为什么需要它：nginx-wb.conf 里引用了 /etc/letsencrypt/live/wb.hoarfrost.cloud/
# 下的证书文件，证书还不存在时 nginx -t 会直接失败，就没法先跑 nginx 去接
# Let's Encrypt 的 HTTP-01 挑战。所以第一次先装本文件 → 签证书 → 再用
# nginx-wb.conf 覆盖。之后本文件不再需要（续期走 webroot，配置里已保留挑战目录）。

server {
    listen 80;
    server_name wb.hoarfrost.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
