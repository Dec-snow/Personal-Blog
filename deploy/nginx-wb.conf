# wb.hoarfrost.cloud —— workbuddy2api 网关 / 面板 反向代理
#
# 安装位置：/etc/nginx/conf.d/wb.conf（与 nebula.hoarfrost.cloud 同目录同风格）
# 后端：宿主机 127.0.0.1:7863（workbuddy2api 容器；compose 里绑回环，不对公网暴露）
#
# 首次签发证书请先装 nginx-wb-bootstrap.conf（无 ssl_certificate 引用，可 nginx -t 通过），
# 证书就绪后再用本文件覆盖。见 .github/workflows/deploy-wb-proxy.yml。

server {
    listen 80;
    server_name wb.hoarfrost.cloud;

    # Let's Encrypt HTTP-01 挑战目录（webroot 方式；续期由系统 certbot.timer 完成，
    # 因此这段必须长期保留，不能只写 return 301）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wb.hoarfrost.cloud;

    ssl_certificate /etc/letsencrypt/live/wb.hoarfrost.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wb.hoarfrost.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 与 config.json → server.max_body_mb 对齐（nginx 默认 1m 会先把长上下文请求 413 掉）
    client_max_body_size 128m;

    # 面板入口：对外只贴 https://wb.hoarfrost.cloud/ 也能落到面板
    location = / {
        return 302 /panel/;
    }

    location / {
        proxy_pass http://127.0.0.1:7863;   # 末尾不要加 "/"，否则 /panel/ 前缀会被剥掉
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 流式输出（SSE）：不关缓冲的话 /v1/chat/completions 会攒完整段才吐给客户端
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 可选加固：面板/API 限流（防扫描与暴力试探）。启用时把下面两行取消注释，
        # 并在本文件最顶部（http 上下文）加一行：
        #   limit_req_zone $binary_remote_addr zone=wb_api:10m rate=30r/s;
        # limit_req zone=wb_api burst=60 nodelay;
        # limit_req_status 429;
    }
}
